name: Native sandbox platform check

on:
  workflow_call:
    inputs:
      os:
        type: string
        required: true

permissions:
  contents: read

jobs:
  native:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tests/features/shell/native-sandbox
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Read the embedded Node version
        id: pins
        working-directory: .
        shell: bash
        run: echo "node=$(jq -r .node versions.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.pins.outputs.node }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        working-directory: .
      - name: Build packaged diagnostic and native fixtures
        working-directory: .
        run: |
          bun scripts/sidecar.ts --build-only
          bun build tests/features/shell/native-sandbox/probe.mjs tests/features/shell/native-sandbox/benchmark.mjs --target=node --external @anthropic-ai/sandbox-runtime --outdir .data/native
      - uses: actions/download-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: sandbox-helpers-${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
          path: ${{ runner.temp }}/helpers
      - name: Use release-packaged helpers on Linux
        if: runner.os == 'Linux'
        run: |
          arch="${RUNNER_ARCH,,}"
          directory="$GITHUB_WORKSPACE/packages/sidecar/vendor/linux-$arch"
          mkdir -p "$directory"
          tar -xzf "$RUNNER_TEMP/helpers/linux-$arch.tar.gz" -C "$directory"
          cd "$directory" && sha256sum --check SHA256SUMS
      - name: Probe MXC before provisioning the legacy helper
        id: mxc
        if: runner.os == 'Windows'
        working-directory: .
        run: |
          node .data/build/sidecar/sandbox-check.js packages/sidecar/vendor --mxc-only
          if ($LASTEXITCODE -eq 78 -and '${{ inputs.os }}' -ne 'windows-11-arm') {
            "setup=true" >> $env:GITHUB_OUTPUT
            exit 0
          }
          exit $LASTEXITCODE
      - name: Install the sandbox helper on the disposable Windows runner
        if: steps.mxc.outputs.setup == 'true'
        working-directory: .
        run: node node_modules/@anthropic-ai/sandbox-runtime/dist/cli.js windows-install --skip-profile-grant
      - name: Verify packaged sandbox startup
        working-directory: .
        run: node .data/build/sidecar/sandbox-check.js packages/sidecar/vendor
      - name: Measure native launch overhead
        run: node ../../../../.data/native/benchmark.js
      - name: Verify workspace execution and denial attribution
        run: node ../../../../.data/native/probe.js
