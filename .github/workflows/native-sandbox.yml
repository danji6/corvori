name: Native sandbox prototype

on:
  pull_request:
    paths:
      - 'tests/features/shell/native-sandbox/**'
      - '.github/workflows/native-sandbox.yml'
  push:
    branches: [codex/sidecar-shell-sandbox]

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tests/features/shell/native-sandbox
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Install Linux sandbox dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap socat ripgrep
      - name: Install the sandbox helper on the disposable Windows runner
        if: runner.os == 'Windows'
        run: node node_modules/@anthropic-ai/sandbox-runtime/dist/cli.js windows-install --skip-profile-grant
      - name: Measure native launch overhead
        run: |
          bun build benchmark.mjs --target=node --external @anthropic-ai/sandbox-runtime --outfile node_modules/native-benchmark.mjs
          node node_modules/native-benchmark.mjs
      - name: Verify workspace execution and denial attribution
        if: ${{ !cancelled() }}
        run: node probe.mjs
